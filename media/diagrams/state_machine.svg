<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1F2933; }
      .state { font-size: 20px; font-weight: 700; fill: #1F2933; }
      .desc { font-size: 13px; fill: #52606D; }
      .label { font-size: 13.5px; fill: #3E4C59; }
      .lost { font-size: 13.5px; fill: #C0392B; }
      .note { font-size: 14px; fill: #3E4C59; font-style: italic; }
      .edge { stroke: #4A5568; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .bus-lost { stroke: #C0392B; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
      .edge-lost { stroke: #C0392B; stroke-width: 2; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect x="0" y="0" width="1120" height="470" rx="16" fill="#FFFFFF"/>
  <text x="560" y="40" text-anchor="middle" class="title">ViamGreeter: behavior state machine</text>

  <!-- greeting group shading -->
  <rect x="372" y="150" width="716" height="132" rx="14" fill="#F2FAF4" stroke="#9CCFAE" stroke-width="1.5"/>
  <text x="730" y="272" text-anchor="middle" class="desc">greeting: the base keeps tracking the person throughout</text>

  <!-- start -->
  <circle cx="44" cy="206" r="10" fill="#1F2933"/>
  <path class="edge" d="M54,206 L98,206"/>

  <!-- states -->
  <rect x="100" y="166" width="190" height="80" rx="12" fill="#E3ECFC" stroke="#3B6FD8" stroke-width="1.8"/>
  <text x="195" y="200" text-anchor="middle" class="state">Idle</text>
  <text x="195" y="224" text-anchor="middle" class="desc">slow scanning sway</text>

  <rect x="392" y="166" width="190" height="80" rx="12" fill="#E2F4E8" stroke="#2E8B57" stroke-width="1.8"/>
  <text x="487" y="200" text-anchor="middle" class="state">Point</text>
  <text x="487" y="224" text-anchor="middle" class="desc">arm level, at the person</text>

  <rect x="642" y="166" width="190" height="80" rx="12" fill="#E2F4E8" stroke="#2E8B57" stroke-width="1.8"/>
  <text x="737" y="200" text-anchor="middle" class="state">Beckon</text>
  <text x="737" y="224" text-anchor="middle" class="desc">low reach, curl back × 2</text>

  <rect x="892" y="166" width="190" height="80" rx="12" fill="#E2F4E8" stroke="#2E8B57" stroke-width="1.8"/>
  <text x="987" y="200" text-anchor="middle" class="state">Wave</text>
  <text x="987" y="224" text-anchor="middle" class="desc">hand raised, sway × 2</text>

  <!-- forward transitions -->
  <path class="edge" d="M290,206 L390,206"/>
  <text x="335" y="112" text-anchor="middle" class="label">new confirmed</text>
  <text x="335" y="129" text-anchor="middle" class="label">person</text>
  <text x="335" y="146" text-anchor="middle" class="label">(after ≥ 2 s idle)</text>

  <path class="edge" d="M582,206 L640,206"/>
  <text x="611" y="160" text-anchor="middle" class="label">2.5 s</text>

  <path class="edge" d="M832,206 L890,206"/>
  <text x="861" y="160" text-anchor="middle" class="label">2 beckons</text>

  <!-- target lost: dashed bus above -->
  <path class="bus-lost" d="M487,166 L487,96"/>
  <path class="bus-lost" d="M737,166 L737,96"/>
  <path class="edge-lost" d="M987,166 L987,96 L195,96 L195,164"/>
  <text x="640" y="86" text-anchor="middle" class="lost">target out of view for 2 s: stop the greeting and return to idle</text>

  <!-- completion return below -->
  <path class="edge" d="M987,246 L987,330 L195,330 L195,248"/>
  <text x="591" y="352" text-anchor="middle" class="label">two waves done: person marked as greeted, idle resumes from the arm's current pose</text>

  <text x="560" y="410" text-anchor="middle" class="note">A greeted person isn't greeted again while they stay in view. Someone out of view for more than 3 s is treated as new.</text>
  <text x="560" y="434" text-anchor="middle" class="note">The next person in the queue (closest first) is greeted after at least 2 s of idle.</text>
</svg>
